<!DOCTYPE html>
<!--
  Mo — fresh build from zero, April 22, 2026

  One thing this must do perfectly:
    Federal seller asks a question about the federal market → real
    contracts appear in seconds, with a sentence of context above
    and a sentence of coaching below each one.

  One answer shape for data questions: a list of real contracts.
  No cards. No treemaps. No donuts. No followup chips. No Mo persona
  paragraphs. Just real data and one line of voice.

  Coaching and conversational follow-ups: Mo responds in prose, same
  stream. She decides which mode the question needs.

  Preserved from the old build: Mo's green face, the warm Atkinson
  type, the purple primary. Everything else is gone on purpose.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FDFCFF" media="(prefers-color-scheme: light)">
<title>Mo — federal spending, asked.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary-100: #46446E;
    --primary-60:  #7572B7;
    --primary-20:  #E3E3F1;

    --text-title: #2C2933;
    --text-body:  #2E2C35;
    --text-muted: #4A475A;
    --text-faint: #6C6880;

    --bg-screen: #FDFCFF;
    --bg-card:   #FFFFFF;
    --bg-tint:   #F6F5FB;

    --border:      #E3E3F1;
    --border-soft: #EFEEF7;

    --green-mo:    #7CB583;
    --urgent:      #B84545;

    --font: 'Atkinson Hyperlegible Next', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --text-title: #F0EEF5;
      --text-body:  #E4E2EA;
      --text-muted: #B5B2C0;
      --text-faint: #8F8C9C;
      --bg-screen:  #0F0E13;
      --bg-card:    #1A1922;
      --bg-tint:    #1E1D28;
      --border:     #2D2B3A;
      --border-soft:#23222E;
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: var(--font);
    background: var(--bg-screen);
    color: var(--text-body);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 220px;
    min-height: 100vh;
  }

  .mo-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }
  .mo-face {
    width: 36px; height: 36px;
    flex-shrink: 0;
  }
  .mo-title {
    font-weight: 700;
    font-size: 20px;
    color: var(--text-title);
    letter-spacing: -0.01em;
  }
  .mo-tagline {
    color: var(--text-muted);
    font-size: 15px;
    margin-bottom: 40px;
  }

  .thread {
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .turn-user {
    align-self: flex-end;
    max-width: 85%;
    background: var(--primary-100);
    color: #fff;
    padding: 10px 16px;
    border-radius: 18px 18px 4px 18px;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .turn-mo {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .turn-mo-voice {
    color: var(--text-body);
    font-size: 15px;
    line-height: 1.6;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 4px;
  }
  .list-item {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color 0.15s ease;
  }
  .list-item:hover { border-color: var(--primary-60); }

  .list-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: baseline;
  }
  .list-vendor {
    font-weight: 600;
    font-size: 15px;
    color: var(--text-title);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .list-amount {
    font-weight: 700;
    font-size: 15px;
    color: var(--text-title);
    white-space: nowrap;
  }
  .list-meta {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .list-days {
    font-weight: 600;
    color: var(--primary-100);
  }
  .list-days.soon { color: var(--urgent); }
  .list-id {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
  }
  .list-scope {
    font-size: 13px;
    color: var(--text-body);
    line-height: 1.5;
  }
  .list-insight {
    font-size: 14px;
    color: var(--text-body);
    line-height: 1.55;
    padding-top: 8px;
    border-top: 1px solid var(--border-soft);
    margin-top: 2px;
  }
  .list-link {
    font-size: 12px;
    color: var(--primary-60);
    text-decoration: none;
    align-self: flex-start;
    margin-top: 2px;
  }
  .list-link:hover { text-decoration: underline; }

  .composer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, transparent 0%, var(--bg-screen) 25%);
    padding: 50px 20px 24px;
    z-index: 10;
  }
  .composer-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .composer-input {
    flex: 1;
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    font-family: inherit;
    font-size: 15px;
    color: var(--text-body);
    resize: none;
    outline: none;
    max-height: 140px;
    line-height: 1.5;
    transition: border-color 0.15s ease;
  }
  .composer-input:focus { border-color: var(--primary-60); }
  .composer-input::placeholder { color: var(--text-faint); }
  .composer-send {
    background: var(--primary-100);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity 0.15s ease;
  }
  .composer-send:hover { opacity: 0.9; }
  .composer-send:disabled { opacity: 0.4; cursor: not-allowed; }

  .thinking {
    color: var(--text-faint);
    font-style: italic;
    font-size: 14px;
  }
  .thinking .dots::after {
    content: '...';
    display: inline-block;
    animation: dotting 1.4s infinite steps(4, end);
    width: 1.2em;
    text-align: left;
    overflow: hidden;
    vertical-align: bottom;
  }
  @keyframes dotting {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75%, 100% { content: '...'; }
  }

  .seed {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .seed-title {
    color: var(--text-body);
    font-size: 17px;
    line-height: 1.5;
  }
  .seed-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .seed-chip {
    background: var(--bg-tint);
    border: 1px solid var(--border-soft);
    color: var(--text-body);
    padding: 8px 14px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .seed-chip:hover {
    background: var(--primary-20);
    border-color: var(--primary-60);
  }

  .notice {
    color: var(--text-muted);
    font-size: 14px;
    font-style: italic;
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="icon-face-mo" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="20" fill="#7CB583"/>
    <circle cx="14" cy="16" r="2.4" fill="#2D5033"/>
    <circle cx="26" cy="16" r="2.4" fill="#2D5033"/>
    <path d="M12 24 Q20 31 28 24" fill="none" stroke="#2D5033" stroke-width="2.8" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="app">
  <div class="mo-head">
    <svg class="mo-face" viewBox="0 0 40 40"><use href="#icon-face-mo"/></svg>
    <div class="mo-title">Mo</div>
  </div>
  <div class="mo-tagline">Ask federal spending anything.</div>

  <div class="thread" id="thread">
    <div class="seed" id="seed">
      <div class="seed-title">Try:</div>
      <div class="seed-chips">
        <button class="seed-chip" data-q="cybersecurity at DHS">cybersecurity at DHS</button>
        <button class="seed-chip" data-q="who's winning at the VA">who's winning at the VA</button>
        <button class="seed-chip" data-q="cloud expiring at DoD">cloud expiring at DoD</button>
      </div>
    </div>
  </div>
</div>

<form class="composer" id="composer" onsubmit="return false;">
  <div class="composer-inner">
    <textarea
      id="input"
      class="composer-input"
      placeholder="Ask Mo..."
      rows="1"
      autofocus></textarea>
    <button type="submit" class="composer-send" id="send">Ask</button>
  </div>
</form>

<script type="module">
import {
  askMo,
  detectPipelineListIntent,
  buildPipelineList,
} from './stream-client.js';

const AI_ENDPOINT = 'https://llonymyskdiakyxhlxlex7ul640hbcke.lambda-url.us-east-1.on.aws/';

// ── Helpers ──────────────────────────────────────────────────
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};
const money = (amt) => {
  if (amt >= 1e9) return `$${(amt / 1e9).toFixed(1)}B`;
  if (amt >= 1e6) return `$${(amt / 1e6).toFixed(1)}M`;
  if (amt >= 1e3) return `$${(amt / 1e3).toFixed(0)}K`;
  return `$${amt.toFixed(0)}`;
};

const thread = document.getElementById('thread');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const seed = document.getElementById('seed');

const state = {
  history: [],
  lastRows: null,
  lastResolverInput: null,
  lastScope: null,
  busy: false,
};

// ── Rendering ────────────────────────────────────────────────
function appendUserTurn(question) {
  if (seed && seed.parentNode) seed.parentNode.removeChild(seed);
  const turn = el('div', 'turn-user', question);
  thread.appendChild(turn);
  scrollToBottom();
}

function appendMoTurn() {
  const turn = el('div', 'turn-mo');
  const voice = el('div', 'turn-mo-voice');
  voice.innerHTML = `<span class="thinking">Mo's looking<span class="dots"></span></span>`;
  turn.appendChild(voice);
  thread.appendChild(turn);
  scrollToBottom();
  return { turn, voice };
}

function scrollToBottom() {
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function renderList(voiceEl, items, intro, outro) {
  voiceEl.innerHTML = '';
  if (intro) {
    const p = el('div');
    p.textContent = intro;
    voiceEl.appendChild(p);
  }
  const list = el('div', 'list');
  items.forEach((item) => {
    const r = item.record || item;
    const card = el('div', 'list-item');

    const head = el('div', 'list-head');
    head.appendChild(el('div', 'list-vendor', r.vendor || 'Unknown'));
    head.appendChild(el('div', 'list-amount', money(r.amount || 0)));
    card.appendChild(head);

    const meta = el('div', 'list-meta');
    if (r.office) meta.appendChild(el('span', null, r.office));
    if (r.daysLeft !== null && r.daysLeft !== undefined) {
      if (r.office) meta.appendChild(el('span', null, '·'));
      const days = el('span', 'list-days', `${r.daysLeft}d`);
      if (r.daysLeft <= 90) days.classList.add('soon');
      meta.appendChild(days);
    }
    if (r.awardId) {
      if (meta.childNodes.length) meta.appendChild(el('span', null, '·'));
      meta.appendChild(el('span', 'list-id', r.awardId));
    }
    card.appendChild(meta);

    if (r.description) {
      card.appendChild(el('div', 'list-scope', r.description));
    }
    if (item.insight) {
      card.appendChild(el('div', 'list-insight', item.insight));
    }
    if (r.awardId) {
      const link = el('a', 'list-link', 'Verify on USASpending →');
      link.href = `https://www.usaspending.gov/award/${encodeURIComponent(r.awardId)}`;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      card.appendChild(link);
    }
    list.appendChild(card);
  });
  voiceEl.appendChild(list);
  if (outro) {
    const p = el('div');
    p.style.marginTop = '14px';
    p.textContent = outro;
    voiceEl.appendChild(p);
  }
  scrollToBottom();
}

function renderProse(voiceEl, text) {
  voiceEl.innerHTML = '';
  const p = el('div');
  p.textContent = text;
  voiceEl.appendChild(p);
  scrollToBottom();
}

function renderNotice(voiceEl, message) {
  voiceEl.innerHTML = '';
  const p = el('div', 'notice', message);
  voiceEl.appendChild(p);
  scrollToBottom();
}

// ── Core flow ───────────────────────────────────────────────
async function ask(question) {
  if (state.busy) return;
  state.busy = true;
  sendBtn.disabled = true;

  appendUserTurn(question);
  const { voice } = appendMoTurn();

  try {
    // Hot path: user is asking for a list AND we have active rows AND the
    // scope still matches. Skip the LLM entirely and build the list
    // deterministically from the cached rows. This makes follow-ups like
    // "now for splunk" or "give me 5 salesforce-ready" instant and
    // fabrication-proof.
    const intent = detectPipelineListIntent(question);
    if (intent && state.lastRows && state.lastRows.length > 0 && !questionNamesNewScope(question)) {
      const pl = await buildPipelineList({
        rows: state.lastRows,
        count: intent.count,
        lens: intent.lens,
        scope: state.lastScope,
        endpoint: AI_ENDPOINT,
      });
      renderList(voice, pl.items, pl.intro, pl.outro);
      state.history.push({ role: 'user', content: question });
      state.history.push({ role: 'model', content: `[list: ${pl.items.length} records from ${state.lastScope}]` });
      return;
    }

    // Otherwise ask Mo. She decides: data-tag (pull data) or prose (coach).
    const result = await askMo({
      question,
      history: state.history.slice(-4),
      activeCardSummary: null,
      endpoint: AI_ENDPOINT,
      render: buildRenderShim(voice),
    });

    if (result.mode === 'data' && result.rows && result.rows.length > 0) {
      state.lastRows = result.rows;
      state.lastResolverInput = result.resolverInput;
      state.lastScope = labelResolverInput(result.resolverInput);
      state.history.push({ role: 'user', content: question });
      state.history.push({ role: 'model', content: `[data pulled: ${state.lastScope}]` });

      const count = intent?.count || Math.min(10, result.rows.length);
      const pl = await buildPipelineList({
        rows: result.rows,
        count,
        lens: intent?.lens || null,
        scope: state.lastScope,
        endpoint: AI_ENDPOINT,
      });
      renderList(voice, pl.items, pl.intro, pl.outro);
    } else if (result.mode === 'prose' && result.text) {
      // Coaching / conversational follow-up — Mo responds in her own voice.
      renderProse(voice, result.text);
      state.history.push({ role: 'user', content: question });
      state.history.push({ role: 'model', content: result.text });
    } else if (result.mode === 'no_data') {
      renderNotice(voice, "I couldn't find contracts for that. Try a different agency, vendor, or topic — or describe what you're looking for.");
    } else if (result.mode === 'error') {
      renderNotice(voice, 'Hit an error on my end. Try that again?');
    } else {
      renderNotice(voice, "Nothing came back for that one. Want to try broader?");
    }
  } catch (err) {
    console.error('[ask] fatal:', err);
    renderNotice(voice, 'Something broke. Try again in a moment.');
  } finally {
    state.busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

// askMo expects render callbacks; we're handling final render ourselves
// based on result.mode, so these are mostly no-ops. We just need to keep
// the thinking indicator visible until the final render replaces it.
function buildRenderShim(voiceEl) {
  return {
    streamPreTagProse: () => {},
    onDataTag: () => {
      voiceEl.innerHTML = `<span class="thinking">Pulling the data<span class="dots"></span></span>`;
      return { _placeholder: true };
    },
    renderDataCard: () => {},
    streamPostTagProse: () => {},
    renderError: () => {},
    complete: () => {},
  };
}

function questionNamesNewScope(question) {
  if (!state.lastResolverInput) return false;
  const text = question.toLowerCase();
  const agencies = [
    'dhs', 'dod', 'navy', 'army', 'air force', 'space force',
    'hhs', 'va', 'veterans affairs', 'treasury', 'doj', 'irs',
    'nasa', 'dla', 'disa', 'dia', 'nsa', 'cia', 'state', 'doc',
    'epa', 'fda', 'cms', 'nih', 'fbi', 'uscis', 'cbp', 'ice',
    'tsa', 'uscg', 'usda', 'education', 'energy', 'interior',
    'justice', 'labor', 'transportation', 'agriculture', 'commerce',
  ];
  const current = (state.lastResolverInput.agency || '').toLowerCase();
  for (const alias of agencies) {
    const regex = new RegExp(`\\b${alias}\\b`);
    if (regex.test(text)) {
      if (!current.includes(alias) && !alias.includes(current.split(' ')[0])) {
        return true;
      }
    }
  }
  return false;
}

function labelResolverInput(input) {
  if (!input) return 'this slice';
  const parts = [];
  if (input.vendor) parts.push(input.vendor);
  if (input.agency) parts.push(input.agency);
  if (input.topic) parts.push(input.topic);
  return parts.length ? parts.join(' · ') : 'this slice';
}

// ── Wiring ───────────────────────────────────────────────────
function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(140, input.scrollHeight) + 'px';
}
input.addEventListener('input', autoGrow);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    submitInput();
  }
});

function submitInput() {
  const q = input.value.trim();
  if (!q || state.busy) return;
  input.value = '';
  autoGrow();
  ask(q);
}

sendBtn.addEventListener('click', submitInput);

document.querySelectorAll('.seed-chip').forEach((btn) => {
  btn.addEventListener('click', () => {
    const q = btn.dataset.q;
    if (q) {
      input.value = q;
      submitInput();
    }
  });
});

input.focus();
</script>

</body>
</html>
