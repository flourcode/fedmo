<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mini Mo — Federal Sales</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  /* Production fedmo palette — Mo purple */
  --primary-100: #46446E;
  --primary-80:  #5E5B92;
  --primary-60:  #7572B7;
  --primary-40:  #ACAAD4;
  --primary-20:  #E3E3F1;

  --text-title: #2C2933;
  --text-body:  #2E2C35;
  --text-muted: #4A475A;
  --text-faint: #6C6880;

  --bg-screen: #FDFCFF;
  --bg-card:   #FFFFFF;
  --bg-tint:   #F6F5FB;

  --border:      #E3E3F1;
  --border-soft: #EFEEF7;

  --s-1: 4px;  --s-2: 8px;  --s-3: 12px;  --s-4: 16px;
  --s-5: 20px; --s-6: 24px; --s-8: 32px;

  --radius:    16px;
  --radius-sm: 12px;
  --radius-pill: 999px;
  --shadow-lift: 0 4px 16px rgba(70,68,110,0.10);
  --track-tight: -0.01em;

  --font: 'Atkinson Hyperlegible Next', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg-screen);
  color: var(--text-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}
button, input, textarea { font-family: var(--font); }
button { cursor: pointer; }
a { color: var(--primary-80); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Header ─────────────────────────────────────────────── */
.mo-header {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg-screen);
  padding: var(--s-3);
  padding-top: calc(var(--s-3) + env(safe-area-inset-top));
  border-bottom: 1px solid var(--border-soft);
}
.mo-header-inner {
  max-width: 720px; margin: 0 auto;
  display: flex; align-items: baseline; gap: var(--s-3);
}
.mo-title {
  font-size: 17px; font-weight: 700; letter-spacing: var(--track-tight);
  color: var(--text-title); margin: 0;
}
.mo-subtitle {
  font-size: 13px; color: var(--text-faint); font-weight: 500;
}

/* ── Conversation ──────────────────────────────────────── */
.mo-app {
  max-width: 720px; margin: 0 auto;
  padding: var(--s-3) var(--s-3) var(--s-8);
}

.mo-turn { margin-bottom: var(--s-6); }
.mo-turn-user {
  display: flex; justify-content: flex-end;
  margin-bottom: var(--s-4);
}
.mo-turn-user .mo-bubble {
  background: var(--primary-100); color: white;
  padding: var(--s-3) var(--s-4);
  border-radius: var(--radius);
  max-width: 80%; font-size: 15px;
  white-space: pre-wrap; word-wrap: break-word;
}

.mo-turn-mo .mo-prose {
  font-size: 15px; line-height: 1.55;
  color: var(--text-body);
  white-space: pre-wrap; word-wrap: break-word;
  margin-bottom: var(--s-3);
}

.mo-turn-mo .mo-err {
  margin-top: var(--s-2);
  padding: var(--s-2) var(--s-3);
  background: #FEF2F2; color: #991B1B;
  border-radius: var(--radius-sm); font-size: 13px;
}

/* ── Card ──────────────────────────────────────────────── */
.mo-card {
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lift);
  margin: var(--s-4) 0;
  overflow: hidden;
}
.mo-card-head {
  padding: var(--s-4) var(--s-5) var(--s-3);
  border-bottom: 1px solid var(--border-soft);
}
.mo-card-title {
  font-size: 17px; font-weight: 700;
  color: var(--text-title);
  letter-spacing: var(--track-tight);
  margin: 0 0 var(--s-1);
}
.mo-card-meta {
  font-size: 13px; color: var(--text-muted);
  font-weight: 500;
}
.mo-card-resolved {
  font-size: 12px; color: var(--text-faint);
  padding: var(--s-2) var(--s-5);
  background: var(--bg-tint);
  border-bottom: 1px solid var(--border-soft);
}
.mo-card-resolved code {
  background: var(--primary-20); color: var(--primary-100);
  padding: 1px 6px; border-radius: 4px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 11px;
}

.mo-comp-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: var(--s-4) var(--s-5) var(--s-2);
}
.mo-comp-title {
  font-size: 14px; font-weight: 700;
  color: var(--text-title);
  letter-spacing: var(--track-tight);
}
.mo-comp-meta {
  font-size: 12px; color: var(--text-faint); font-weight: 500;
}

.mo-card-loading {
  padding: var(--s-6) var(--s-5);
  text-align: center;
  color: var(--text-faint);
  font-size: 14px;
}
.mo-card-empty {
  padding: var(--s-6) var(--s-5);
  text-align: center;
  color: var(--text-muted);
  font-size: 14px;
}

/* ── Treemap ──────────────────────────────────────────── */
.mo-treemap-host {
  margin: 0 var(--s-5) var(--s-4);
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--bg-tint);
}
.mo-treemap {
  display: block; width: 100%; height: 220px;
}
.mo-treemap rect { transition: opacity 120ms; }
.mo-treemap text {
  pointer-events: none;
  font-family: var(--font);
}

/* ── Table ────────────────────────────────────────────── */
.mo-table-wrap {
  margin: 0 var(--s-5) var(--s-4);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-soft);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.mo-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.mo-table th, .mo-table td {
  text-align: left;
  padding: var(--s-2) var(--s-3);
  border-bottom: 1px solid var(--border-soft);
}
.mo-table th {
  background: var(--bg-tint);
  font-weight: 600;
  color: var(--text-muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  position: sticky; top: 0;
}
.mo-table tbody tr:last-child td { border-bottom: none; }
.mo-table tbody tr:hover { background: var(--bg-tint); }
.mo-td-recipient {
  font-weight: 500; color: var(--text-title);
  white-space: nowrap;
  max-width: 220px;
  overflow: hidden; text-overflow: ellipsis;
}
.mo-td-amount {
  font-variant-numeric: tabular-nums;
  text-align: right; white-space: nowrap;
  font-weight: 600; color: var(--text-title);
}
.mo-td-desc {
  color: var(--text-muted);
  max-width: 380px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ── State map ────────────────────────────────────────── */
.mo-statemap-host {
  margin: 0 var(--s-5) var(--s-4);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.mo-statemap { display: block; width: 100%; height: auto; }

/* ── SEC filings ──────────────────────────────────────── */
.mo-sec-list {
  margin: 0 var(--s-5) var(--s-4);
  display: grid; gap: var(--s-3);
}
.mo-sec-vendor {
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  padding: var(--s-3) var(--s-4);
  background: var(--bg-card);
}
.mo-sec-vendor-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: var(--s-2);
}
.mo-sec-vendor-name {
  font-weight: 600; color: var(--text-title);
  font-size: 14px;
}
.mo-sec-vendor-ticker {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 11px; color: var(--text-faint);
  background: var(--bg-tint);
  padding: 1px 6px; border-radius: 4px;
}
.mo-sec-filing {
  display: flex; justify-content: space-between;
  padding: var(--s-1) 0;
  font-size: 13px;
  border-bottom: 1px dashed var(--border-soft);
  text-decoration: none; color: inherit;
}
.mo-sec-filing:last-of-type { border-bottom: none; }
.mo-sec-filing:hover { background: var(--bg-tint); }
.mo-sec-form {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  color: var(--primary-80); font-weight: 600;
}
.mo-sec-date { color: var(--text-faint); }
.mo-sec-all {
  display: inline-block; margin-top: var(--s-2);
  font-size: 12px; color: var(--primary-60);
  font-weight: 500;
}

/* ── Cumulative-amount note ───────────────────────────── */
.mo-amount-note {
  padding: 0 var(--s-5) var(--s-4);
  font-size: 11px; color: var(--text-faint);
  font-style: italic;
}

/* ── Composer ─────────────────────────────────────────── */
.mo-composer {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: var(--s-3) var(--s-3) calc(var(--s-3) + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg-screen) 70%, transparent);
  z-index: 100;
}
.mo-composer-inner {
  max-width: 720px; margin: 0 auto;
  display: flex; gap: var(--s-2);
}
.mo-composer textarea {
  flex: 1;
  background: var(--bg-card);
  color: var(--text-body);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: var(--s-3) var(--s-4);
  font-size: 15px; line-height: 1.4;
  resize: none;
  min-height: 48px; max-height: 200px;
  box-shadow: var(--shadow-lift);
}
.mo-composer textarea:focus {
  outline: none;
  border-color: var(--primary-60);
  box-shadow: 0 0 0 3px var(--primary-20);
}
.mo-composer button {
  background: var(--primary-100);
  color: white; border: 0;
  border-radius: var(--radius);
  padding: 0 var(--s-5);
  font-size: 15px; font-weight: 600;
  min-height: 48px;
}
.mo-composer button:hover { background: var(--primary-80); }
.mo-composer button:disabled {
  background: var(--primary-40);
  cursor: not-allowed;
}

/* ── Mobile tweaks ────────────────────────────────────── */
@media (max-width: 600px) {
  .mo-app { padding: var(--s-2); }
  .mo-card-head { padding: var(--s-3) var(--s-4) var(--s-2); }
  .mo-comp-head { padding: var(--s-3) var(--s-4) var(--s-2); }
  .mo-treemap-host, .mo-statemap-host, .mo-sec-list, .mo-table-wrap {
    margin-left: var(--s-3); margin-right: var(--s-3);
  }
  .mo-card-resolved { padding-left: var(--s-4); padding-right: var(--s-4); }
  .mo-amount-note { padding-left: var(--s-4); padding-right: var(--s-4); }
}
</style>
</head>
<body>

<header class="mo-header">
  <div class="mo-header-inner">
    <h1 class="mo-title">Mini Mo</h1>
    <span class="mo-subtitle">federal sales · USASpending · EDGAR</span>
  </div>
</header>

<main class="mo-app">
  <div id="conversation"></div>
</main>

<form class="mo-composer" id="composer">
  <div class="mo-composer-inner">
    <textarea id="input" placeholder="Ask Mo… (e.g. 'show me AWS at DoD past year')" autofocus></textarea>
    <button type="submit" id="send">Ask</button>
  </div>
</form>

<script>
'use strict';

// =============================================================================
// CONFIG
// =============================================================================
const LAMBDA_URL = 'https://4gxuwrrugc4s6zqcxsos2exg5y0sjcrc.lambda-url.us-east-1.on.aws/';
const USASPENDING = 'https://api.usaspending.gov/api/v2';

// =============================================================================
// STATE
// =============================================================================
const history = [];
let busy = false;
const $conv = document.getElementById('conversation');
const $input = document.getElementById('input');
const $send = document.getElementById('send');

// =============================================================================
// TINY DOM HELPERS
// =============================================================================
const escapeHtml = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

const $$ = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null) continue;
    el.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
  }
  return el;
};

const fmtMoney = (n) => {
  const x = Number(n) || 0;
  if (x >= 1e9) return '$' + (x / 1e9).toFixed(1) + 'B';
  if (x >= 1e6) return '$' + (x / 1e6).toFixed(1) + 'M';
  if (x >= 1e3) return '$' + (x / 1e3).toFixed(0) + 'K';
  return '$' + x.toFixed(0);
};

// =============================================================================
// TAG PARSER (hardened)
// =============================================================================
//
// Self-closing <data ... /> only. Strict on purpose: if Mo writes commentary
// inside an attribute value, the tag becomes structurally broken and we must
// fail to fire rather than fire with garbage attributes that the API will
// 422 on.
//
// Rules:
//   - tag content (between <data and />) is at most 600 chars
//   - attribute values cannot contain newlines or > characters
//   - attribute values are quote-balanced
const TAG_RE = /<data\b([^>]{1,600}?)\/>/i;

function findDataTag(text) {
  const m = TAG_RE.exec(text);
  if (!m) return null;
  const inside = m[1];
  if (/\n/.test(inside)) return null;  // commentary leaked into attributes
  const attrs = {};
  const attrRe = /(\w+)\s*=\s*("([^">\n]*)"|'([^'>\n]*)')/g;
  let am;
  while ((am = attrRe.exec(inside))) attrs[am[1]] = am[3] !== undefined ? am[3] : am[4];
  return { match: m[0], start: m.index, end: m.index + m[0].length, attrs };
}

// Detect a tag opening that NEVER closed — Mo started writing a tag but ran
// off into prose without `/>`. We hide this fragment from displayed prose.
function findBrokenTagStart(text) {
  // <data appears, but no /> within 1000 chars and no clean close
  const open = /<data\b/i.exec(text);
  if (!open) return -1;
  // Look for /> after it; if found, this is fine — the regular parser handles it
  if (text.indexOf('/>', open.index) !== -1) return -1;
  return open.index;
}

// =============================================================================
// USASPENDING
// =============================================================================
const CSV = (s) => String(s || '').split(',').map(x => x.trim()).filter(Boolean);

const AWARD_TYPE_GROUPS = {
  contracts: ['A', 'B', 'C', 'D'],
  idvs: ['IDV_A', 'IDV_B', 'IDV_B_A', 'IDV_B_B', 'IDV_B_C', 'IDV_C', 'IDV_D', 'IDV_E'],
  grants: ['02', '03', '04', '05'],
};

// `Place of Performance State Code` is what powers the state map. Without
// it in FIELDS, USASpending returns rows but no state info, and the map
// silently shows nothing.
const FIELDS = [
  'Award ID', 'Recipient Name', 'Award Amount', 'Description',
  'Start Date', 'End Date',
  'Awarding Agency', 'Awarding Sub Agency',
  'Place of Performance State Code',
];
const SUB_FIELDS = [
  'Sub-Award ID', 'Sub-Awardee Name', 'Sub-Award Amount', 'Sub-Award Description',
  'Sub-Award Date', 'Prime Recipient Name', 'Awarding Agency', 'Awarding Sub Agency',
];

const PSC_TIERS = { D: 'Service', R: 'Service', '7': 'Product', A: 'Research and Development', Y: 'Construction' };

async function resolveAgency(name) {
  try {
    const r = await fetch(`${USASPENDING}/autocomplete/awarding_agency/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ search_text: name, limit: 5 }),
    });
    if (!r.ok) return null;
    const body = await r.json();
    const top = (body.results || [])[0];
    if (!top) return null;
    if (top.toptier_flag && top.toptier_agency?.name) {
      return {
        filter: { tier: 'toptier', name: top.toptier_agency.name, type: 'awarding' },
        label: top.toptier_agency.abbreviation || top.toptier_agency.name,
      };
    }
    if (top.subtier_agency?.name) {
      return {
        filter: { tier: 'subtier', name: top.subtier_agency.name, type: 'awarding' },
        label: `${top.subtier_agency.abbreviation || top.subtier_agency.name} (${top.toptier_agency?.abbreviation || ''})`,
      };
    }
    return null;
  } catch { return null; }
}

async function resolveRecipient(name) {
  try {
    const r = await fetch(`${USASPENDING}/autocomplete/recipient/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ search_text: name, limit: 5 }),
    });
    if (!r.ok) return null;
    const body = await r.json();
    const results = body.results || [];
    if (!results.length) return null;
    const upName = name.toUpperCase();
    const wbRe = new RegExp(`\\b${upName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`);
    const wordMatch = results.find(x => wbRe.test(String(x.recipient_name || '').toUpperCase()));
    if (wordMatch) return wordMatch.recipient_name;
    return results[0].recipient_name || null;
  } catch { return null; }
}

function buildPscFilter(pscArr) {
  const hier = [];
  for (const code of pscArr) {
    const c = code.toUpperCase();
    if (c.length === 1) {
      const t = PSC_TIERS[c];
      if (t) hier.push([t, c]);
    } else {
      const t = PSC_TIERS[c.charAt(0)] || 'Service';
      hier.push([t, c]);
    }
  }
  return hier.length ? { require: hier } : null;
}

function buildBaseFilters(attrs, agencyFilter) {
  const f = { award_type_codes: AWARD_TYPE_GROUPS.contracts };

  if (attrs.award_types) {
    const codes = AWARD_TYPE_GROUPS[attrs.award_types];
    if (codes) f.award_type_codes = codes;
  }

  if (agencyFilter) f.agencies = [agencyFilter];

  const naics = CSV(attrs.naics).filter(n => /^\d{6}$/.test(n));
  if (naics.length) f.naics_codes = { require: naics };

  const psc = CSV(attrs.psc);
  if (psc.length) {
    const pf = buildPscFilter(psc);
    if (pf) f.psc_codes = pf;
  }

  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const since = DATE_RE.test(String(attrs.since || '')) ? attrs.since : null;
  const until = DATE_RE.test(String(attrs.until || '')) ? attrs.until : null;
  if (since || until) {
    const today = new Date().toISOString().slice(0, 10);
    f.time_period = [{
      date_type: 'date_signed',
      start_date: since || '2020-01-01',
      end_date: until || today,
    }];
  }

  const minA = Number(attrs.min_amount);
  const maxA = Number(attrs.max_amount);
  const validMin = Number.isFinite(minA) && minA > 0;
  const validMax = Number.isFinite(maxA) && maxA > 0;
  if (validMin || validMax) {
    const range = {};
    if (validMin) range.lower_bound = minA;
    if (validMax) range.upper_bound = maxA;
    f.award_amounts = [range];
  }

  return f;
}

async function searchAwards(filters, isSub) {
  const payload = {
    filters,
    fields: isSub ? SUB_FIELDS : FIELDS,
    limit: 100,
    sort: isSub ? 'Sub-Award Amount' : 'Award Amount',
    order: 'desc',
  };
  if (isSub) payload.subawards = true;

  try {
    const r = await fetch(`${USASPENDING}/search/spending_by_award/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!r.ok) {
      const text = await r.text().catch(() => '');
      return { rows: [], error: `USASpending ${r.status}: ${text.slice(0, 200)}` };
    }
    const body = await r.json();
    return { rows: body.results || [], error: null };
  } catch (e) {
    return { rows: [], error: e.message };
  }
}

// Word-boundary needle match — drops false positives where a keyword matched
// a substring of another word ("AWS" inside "AWARD" or "Aegis Weapon System").
const wbRe = (n) => new RegExp(`\\b${String(n).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i');
const matchesAny = (haystacks, needles) =>
  needles.some(n => haystacks.some(h => wbRe(n).test(String(h || ''))));

// =============================================================================
// PULL — orchestrate the right shape based on tag attrs
// =============================================================================
async function pull(attrs) {
  const [agencyResolution, recipientName] = await Promise.all([
    attrs.agency ? resolveAgency(attrs.agency) : Promise.resolve(null),
    attrs.recipient ? resolveRecipient(attrs.recipient) : Promise.resolve(null),
  ]);

  const agencyFilter = agencyResolution?.filter || null;
  const baseFilters = buildBaseFilters(attrs, agencyFilter);
  const isSub = attrs.subawards === 'true';

  const resolved = {
    agencyAsked: attrs.agency || null,
    agencyResolved: agencyResolution?.label || null,
    recipientAsked: attrs.recipient || null,
    recipientResolved: recipientName || null,
  };

  // Subaward branch
  if (isSub) {
    const filters = { ...baseFilters };
    if (recipientName) filters.recipient_search_text = [recipientName];
    const { rows, error } = await searchAwards(filters, true);
    return { rows, resolved, error };
  }

  // Vendor branch — dual-path union + word-boundary post-filter
  if (attrs.recipient) {
    const aliases = CSV(attrs.aliases);
    const needles = [
      ...(recipientName ? [recipientName] : []),
      ...(attrs.recipient ? [attrs.recipient] : []),
      ...aliases,
    ].filter(n => String(n).length >= 4)
     .map(n => n.toUpperCase());

    const directFilters = recipientName
      ? { ...baseFilters, recipient_search_text: [recipientName] }
      : null;

    const keywordNeedles = [...aliases, ...CSV(attrs.keywords)]
      .filter(n => String(n).length >= 4);
    const keywordFilters = keywordNeedles.length > 0
      ? { ...baseFilters, keywords: keywordNeedles }
      : null;

    if (!directFilters && keywordFilters) {
      const { rows, error } = await searchAwards(keywordFilters, false);
      return { rows, resolved, error };
    }

    const queries = [];
    if (directFilters) queries.push(searchAwards(directFilters, false));
    if (keywordFilters) queries.push(searchAwards(keywordFilters, false));
    const results = await Promise.all(queries);

    const errors = results.filter(r => r.error).map(r => r.error);
    if (errors.length === results.length) {
      return { rows: [], resolved, error: errors[0] };
    }

    const seen = new Map();
    for (const r of results) {
      for (const row of r.rows) {
        const id = row['Award ID'];
        if (id && !seen.has(id)) seen.set(id, row);
      }
    }

    let rows = [...seen.values()];
    if (needles.length > 0) {
      rows = rows.filter(row =>
        matchesAny([row['Description'], row['Recipient Name']], needles)
      );
    }

    rows.sort((a, b) => (Number(b['Award Amount']) || 0) - (Number(a['Award Amount']) || 0));
    if (rows.length > 100) rows = rows.slice(0, 100);

    return { rows, resolved, error: null };
  }

  // Default branch
  const filters = { ...baseFilters };
  if (attrs.keywords) {
    const kws = CSV(attrs.keywords);
    if (kws.length) filters.keywords = kws;
  }
  const { rows, error } = await searchAwards(filters, false);
  return { rows, resolved, error };
}

// =============================================================================
// TREEMAP — squarify (Bruls/Huijbregts/van Wijk 2000)
// =============================================================================
//
// Hand-rolled, no dependency. Items must be sorted largest-first.
// Returns input items with { x, y, w, h } added.
function squarify(items, x, y, width, height) {
  const out = [];
  const remaining = items.slice();
  let rect = { x, y, w: width, h: height };

  while (remaining.length > 0) {
    const shortSide = Math.min(rect.w, rect.h);
    const rectArea = rect.w * rect.h;
    const totalValue = remaining.reduce((s, it) => s + it.value, 0);
    const scaled = remaining.map(it => ({ ...it, area: (it.value / totalValue) * rectArea }));

    const row = [scaled[0]];
    let i = 1;
    while (i < scaled.length && worst([...row, scaled[i]], shortSide) <= worst(row, shortSide)) {
      row.push(scaled[i]);
      i++;
    }

    const rowArea = row.reduce((s, it) => s + it.area, 0);
    const rowThickness = rowArea / shortSide;
    let cursor = 0;
    if (rect.w <= rect.h) {
      row.forEach(it => {
        const w = it.area / rowThickness;
        out.push({ ...it, x: rect.x + cursor, y: rect.y, w, h: rowThickness });
        cursor += w;
      });
      rect = { x: rect.x, y: rect.y + rowThickness, w: rect.w, h: rect.h - rowThickness };
    } else {
      row.forEach(it => {
        const h = it.area / rowThickness;
        out.push({ ...it, x: rect.x, y: rect.y + cursor, w: rowThickness, h });
        cursor += h;
      });
      rect = { x: rect.x + rowThickness, y: rect.y, w: rect.w - rowThickness, h: rect.h };
    }

    remaining.splice(0, row.length);
  }
  return out;
}

function worst(row, sideLength) {
  const rowSum = row.reduce((s, it) => s + it.area, 0);
  const sideSq = sideLength * sideLength;
  const sumSq = rowSum * rowSum;
  return Math.max(...row.map(it => Math.max(
    (sideSq * it.area) / sumSq,
    sumSq / (sideSq * it.area),
  )));
}

const TREEMAP_COLORS = ['#46446E', '#5E5B92', '#7572B7', '#9290C5', '#ACAAD4', '#C8C7E2', '#E3E3F1'];

function buildTreemapItems(rows) {
  // Aggregate by recipient — top 6 + "Other"
  const map = {};
  for (const r of rows) {
    const name = r['Recipient Name'] || '(unknown)';
    map[name] = (map[name] || 0) + (Number(r['Award Amount']) || 0);
  }
  const sorted = Object.entries(map).sort((a, b) => b[1] - a[1]);
  const items = sorted.slice(0, 6).map(([name, value], i) => ({
    name, value, color: TREEMAP_COLORS[i] || '#7572B7',
  }));
  if (sorted.length > 6) {
    const otherSum = sorted.slice(6).reduce((s, [, v]) => s + v, 0);
    items.push({ name: `Other (${sorted.length - 6})`, value: otherSum, color: TREEMAP_COLORS[6] });
  }
  return items.filter(x => x.value > 0);
}

function renderTreemapInto(host, items) {
  if (!items.length) return;
  const W = host.clientWidth || 320;
  const H = 220;
  const sorted = items.slice().sort((a, b) => b.value - a.value);
  const laid = squarify(sorted, 0, 0, W, H);
  const PADDING = 2;

  const textColorFor = (hex) => {
    const h = hex.replace('#', '');
    const r = parseInt(h.slice(0, 2), 16) / 255;
    const g = parseInt(h.slice(2, 4), 16) / 255;
    const b = parseInt(h.slice(4, 6), 16) / 255;
    const lin = (c) => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    const L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
    return L > 0.55
      ? { name: 'rgba(44,41,51,0.98)', value: 'rgba(44,41,51,0.80)' }
      : { name: 'rgba(255,255,255,0.96)', value: 'rgba(255,255,255,0.82)' };
  };

  let svg = `<svg class="mo-treemap" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">`;
  laid.forEach(cell => {
    const rx = cell.x + PADDING / 2;
    const ry = cell.y + PADDING / 2;
    const rw = Math.max(0, cell.w - PADDING);
    const rh = Math.max(0, cell.h - PADDING);
    svg += `<rect x="${rx.toFixed(1)}" y="${ry.toFixed(1)}" width="${rw.toFixed(1)}" height="${rh.toFixed(1)}" fill="${cell.color}" rx="3"/>`;
    if (rw > 55 && rh > 30) {
      const area = rw * rh;
      const nameFont = area > 12000 ? 16 : area > 5000 ? 13 : 11;
      const valueFont = Math.max(nameFont - 2, 10);
      const charsFit = Math.max(4, Math.floor((rw - 12) / (nameFont * 0.55)));
      const name = cell.name.length > charsFit ? cell.name.slice(0, charsFit - 1) + '…' : cell.name;
      const tc = textColorFor(cell.color);
      svg += `<text x="${(rx + 6).toFixed(1)}" y="${(ry + nameFont + 4).toFixed(1)}" fill="${tc.name}" font-size="${nameFont}" font-weight="600">${escapeHtml(name)}</text>`;
      if (rh > nameFont + valueFont + 12) {
        svg += `<text x="${(rx + 6).toFixed(1)}" y="${(ry + nameFont + valueFont + 10).toFixed(1)}" fill="${tc.value}" font-size="${valueFont}" font-weight="500">${fmtMoney(cell.value)}</text>`;
      }
    }
  });
  svg += `</svg>`;
  host.innerHTML = svg;
}

function buildGeography(rows) {
  const geo = {};
  for (const r of rows) {
    const code = r['Place of Performance State Code'];
    if (!code) continue;
    geo[code] = (geo[code] || 0) + 1;
  }
  return geo;
}

function renderStateMapInto(host, geography) {
  if (!geography || Object.keys(geography).length === 0) return;
  const W = host.clientWidth || 320;
  const COLS = 11, ROWS = 7, GAP = 3;
  const TILE = Math.floor((W - (COLS - 1) * GAP) / COLS);
  const H = ROWS * TILE + (ROWS - 1) * GAP;
  const maxCount = Math.max(...Object.values(geography));
  const minOp = 0.18, maxOp = 1.0, emptyOp = 0.06;

  let svg = `<svg class="mo-statemap" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  Object.keys(STATE_TILE_LAYOUT).forEach(code => {
    const [col, row] = STATE_TILE_LAYOUT[code];
    const x = col * (TILE + GAP);
    const y = row * (TILE + GAP);
    const count = geography[code] || 0;
    let opacity;
    if (count === 0) {
      opacity = emptyOp;
    } else {
      const t = Math.sqrt(count) / Math.sqrt(maxCount);
      opacity = minOp + (maxOp - minOp) * t;
    }
    svg += `<rect x="${x}" y="${y}" width="${TILE}" height="${TILE}" rx="2" fill="var(--primary-100)" fill-opacity="${opacity.toFixed(3)}"/>`;
    if (count > 0) {
      const fontSize = Math.min(11, Math.max(9, Math.floor(TILE * 0.42)));
      const cx = x + TILE / 2;
      const cy = y + TILE / 2;
      const textColor = opacity >= 0.60 ? '#FFFFFF' : 'var(--text-title)';
      svg += `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" fill="${textColor}" font-size="${fontSize}" font-weight="600" font-family="var(--font)" style="pointer-events:none;user-select:none;">${code}</text>`;
    }
  });
  svg += `</svg>`;
  host.innerHTML = svg;
}

// 3-pass match: strip suffixes → strip federal subsidiary qualifiers → token-prefix fallback
function matchPublicVendor(vendorName) {
  if (!vendorName) return null;
  let cleaned = String(vendorName).toLowerCase().trim();
  cleaned = cleaned.replace(/^the\s+/, '');
  cleaned = cleaned
    .replace(/\b(corp|corporation|inc|incorporated|llc|l\.l\.c\.|ltd|limited|plc|holdings?|company|co)\b\.?$/i, '')
    .replace(/\s*[,\.]\s*$/, '')
    .trim();

  if (FEDERAL_PUBLIC_VENDORS[cleaned]) return FEDERAL_PUBLIC_VENDORS[cleaned];

  const QUALIFIERS = [
    /\bpublic sector\b/g, /\bgovernment services\b/g, /\bgovernment solutions\b/g,
    /\bfederal services\b/g, /\bfederal solutions\b/g, /\binformation technology\b/g,
    /\bmission systems\b/g, /\bmission technologies\b/g, /\bspace systems\b/g,
    /\bintegrated systems\b/g,
    /\b(federal|government|gov|health|america|americas|public|services|solutions|communications)\b/g,
  ];
  let stripped = cleaned;
  QUALIFIERS.forEach(p => { stripped = stripped.replace(p, ' '); });
  stripped = stripped.replace(/\s+/g, ' ').trim();
  if (stripped !== cleaned && FEDERAL_PUBLIC_VENDORS[stripped]) return FEDERAL_PUBLIC_VENDORS[stripped];

  const tokens = cleaned.split(/\s+/).filter(Boolean);
  for (let n = Math.min(3, tokens.length); n >= 1; n--) {
    const prefix = tokens.slice(0, n).join(' ');
    if (FEDERAL_PUBLIC_VENDORS[prefix]) return FEDERAL_PUBLIC_VENDORS[prefix];
  }
  return null;
}

async function fetchEdgarFilings(cik) {
  try {
    const r = await fetch(LAMBDA_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ request_type: 'edgar_proxy', cik }),
    });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) {
    console.warn('[edgar] fetch failed cik=' + cik, e.message);
    return null;
  }
}

function extractRecentFilings(payload, limit) {
  const recent = payload?.filings?.recent;
  if (!recent || !Array.isArray(recent.form)) return [];
  const out = [];
  for (let i = 0; i < recent.form.length && out.length < limit; i++) {
    if (!SEC_FILING_TYPES_KEEP.has(recent.form[i])) continue;
    out.push({
      form: recent.form[i],
      filedDate: recent.filingDate[i],
      accession: recent.accessionNumber[i],
      primaryDoc: recent.primaryDocument[i],
    });
  }
  return out;
}

const buildFilingUrl = (cik, accession, primaryDoc) => {
  const cikUnpadded = String(parseInt(cik, 10));
  return `https://www.sec.gov/Archives/edgar/data/${cikUnpadded}/${accession.replace(/-/g, '')}/${primaryDoc}`;
};
const buildEdgarBrowseUrl = (cik) =>
  `https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=${cik}&type=&dateb=&owner=include&count=40`;
const formatFilingDate = (iso) => {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  if (!y || !m || !d) return iso;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[m-1]} ${d}, ${y}`;
};

// Identify public primes in the rows, fetch filings, return [{display, cik, ticker, filings}]
async function loadSecFilings(rows) {
  if (!rows || !rows.length) return [];
  // Take top 5 unique recipients by amount
  const byPrime = {};
  for (const r of rows) {
    const name = r['Recipient Name'];
    if (!name) continue;
    byPrime[name] = (byPrime[name] || 0) + (Number(r['Award Amount']) || 0);
  }
  const topPrimes = Object.entries(byPrime).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([n]) => n);

  const seenCiks = new Set();
  const publics = [];
  for (const name of topPrimes) {
    const match = matchPublicVendor(name);
    if (match && !seenCiks.has(match.cik)) {
      seenCiks.add(match.cik);
      publics.push({ display: match.display, cik: match.cik, ticker: match.ticker });
    }
  }
  if (!publics.length) return [];

  const filings = await Promise.all(publics.map(async (v) => {
    const payload = await fetchEdgarFilings(v.cik);
    if (!payload || payload.error) return null;
    const list = extractRecentFilings(payload, 3);
    if (!list.length) return null;
    return { ...v, filings: list };
  }));
  return filings.filter(Boolean);
}

// =============================================================================
// CARD RENDER
// =============================================================================
function renderCard(rows, attrs, resolved) {
  const card = $$('div', { class: 'mo-card' });
  const isSub = attrs.subawards === 'true';
  const total = rows.reduce((s, r) => s + (Number(isSub ? r['Sub-Award Amount'] : r['Award Amount']) || 0), 0);

  const titleBits = [];
  if (resolved.recipientResolved) titleBits.push(resolved.recipientResolved);
  else if (attrs.recipient) titleBits.push(attrs.recipient);
  if (resolved.agencyResolved) titleBits.push(resolved.agencyResolved);
  else if (attrs.agency) titleBits.push(attrs.agency);
  if (attrs.keywords && !attrs.recipient) titleBits.push(`"${attrs.keywords}"`);
  if (isSub) titleBits.push('subawards');
  if (titleBits.length === 0) titleBits.push('Federal contracts');

  const head = $$('div', { class: 'mo-card-head' });
  head.appendChild($$('div', { class: 'mo-card-title', text: titleBits.join(' · ') }));
  head.appendChild($$('div', { class: 'mo-card-meta', text: `${rows.length} contracts · ${fmtMoney(total)}` }));
  card.appendChild(head);

  // Resolution detail line
  const resolveBits = [];
  if (resolved.agencyAsked && resolved.agencyResolved && resolved.agencyAsked !== resolved.agencyResolved) {
    resolveBits.push(`agency "${resolved.agencyAsked}" → ${resolved.agencyResolved}`);
  }
  if (resolved.recipientAsked && resolved.recipientResolved && resolved.recipientAsked !== resolved.recipientResolved) {
    resolveBits.push(`recipient "${resolved.recipientAsked}" → ${resolved.recipientResolved}`);
  }
  if (resolveBits.length) {
    card.appendChild($$('div', { class: 'mo-card-resolved', text: resolveBits.join(' · ') }));
  }

  if (rows.length === 0) {
    card.appendChild($$('div', { class: 'mo-card-empty', text: 'No rows. Try widening the date or dollar window, or rephrasing.' }));
    return card;
  }

  // ── Treemap ──
  const tmItems = isSub ? [] : buildTreemapItems(rows);
  if (tmItems.length > 0) {
    card.appendChild($$('div', { class: 'mo-comp-head' },
      $$('div', { class: 'mo-comp-title', text: 'Where the money is' }),
      $$('div', { class: 'mo-comp-meta', text: `top ${tmItems.length} of ${new Set(rows.map(r => r['Recipient Name']).filter(Boolean)).size} primes` }),
    ));
    const tmHost = $$('div', { class: 'mo-treemap-host' });
    card.appendChild(tmHost);
    // Defer render until host is in DOM (so clientWidth is real)
    requestAnimationFrame(() => renderTreemapInto(tmHost, tmItems));
  }

  // ── Table ──
  card.appendChild($$('div', { class: 'mo-comp-head' },
    $$('div', { class: 'mo-comp-title', text: 'Contracts' }),
    $$('div', { class: 'mo-comp-meta', text: `${rows.length} rows · sorted by amount` }),
  ));
  const tableWrap = $$('div', { class: 'mo-table-wrap' });
  let tbodyHtml = '';
  for (const r of rows) {
    const recipient = isSub ? r['Sub-Awardee Name'] : r['Recipient Name'];
    const amount = isSub ? r['Sub-Award Amount'] : r['Award Amount'];
    const desc = isSub ? r['Sub-Award Description'] : r['Description'];
    tbodyHtml += `<tr>
      <td class="mo-td-recipient" title="${escapeHtml(recipient || '')}">${escapeHtml(recipient || '—')}</td>
      <td class="mo-td-amount">${fmtMoney(amount)}</td>
      <td class="mo-td-desc" title="${escapeHtml(desc || '')}">${escapeHtml((desc || '').slice(0, 200))}</td>
    </tr>`;
  }
  tableWrap.innerHTML = `<table class="mo-table">
    <thead><tr>
      <th>${isSub ? 'Sub-recipient' : 'Recipient'}</th>
      <th style="text-align:right">Amount</th>
      <th>Description</th>
    </tr></thead>
    <tbody>${tbodyHtml}</tbody>
  </table>`;
  card.appendChild(tableWrap);

  // ── Cumulative-amount caveat ──
  if (!isSub && rows.length > 0) {
    card.appendChild($$('div', { class: 'mo-amount-note',
      text: 'Amounts are USASpending Award Amount — cumulative obligated value over a contract\'s lifetime, not a single new obligation.' }));
  }

  // ── State map ──
  if (!isSub) {
    const geo = buildGeography(rows);
    if (Object.keys(geo).length > 0) {
      const stateCount = Object.keys(geo).length;
      card.appendChild($$('div', { class: 'mo-comp-head' },
        $$('div', { class: 'mo-comp-title', text: 'Place of performance' }),
        $$('div', { class: 'mo-comp-meta', text: `${stateCount} state${stateCount === 1 ? '' : 's'}` }),
      ));
      const smHost = $$('div', { class: 'mo-statemap-host' });
      card.appendChild(smHost);
      requestAnimationFrame(() => renderStateMapInto(smHost, geo));
    }
  }

  // ── SEC filings (async — appended below after fetch) ──
  if (!isSub && rows.length > 0) {
    loadSecFilings(rows).then(populated => {
      if (!populated.length) return;
      const totalFilings = populated.reduce((s, v) => s + v.filings.length, 0);
      card.appendChild($$('div', { class: 'mo-comp-head' },
        $$('div', { class: 'mo-comp-title', text: 'SEC filings' }),
        $$('div', { class: 'mo-comp-meta',
          text: `${populated.length} public prime${populated.length === 1 ? '' : 's'} · ${totalFilings} recent filing${totalFilings === 1 ? '' : 's'}` }),
      ));
      const list = $$('div', { class: 'mo-sec-list' });
      let listHtml = '';
      for (const v of populated) {
        listHtml += `<div class="mo-sec-vendor">
          <div class="mo-sec-vendor-head">
            <span class="mo-sec-vendor-name">${escapeHtml(v.display)}</span>
            ${v.ticker ? `<span class="mo-sec-vendor-ticker">${escapeHtml(v.ticker)}</span>` : ''}
          </div>`;
        for (const f of v.filings) {
          const url = buildFilingUrl(v.cik, f.accession, f.primaryDoc);
          listHtml += `<a class="mo-sec-filing" href="${url}" target="_blank" rel="noopener">
            <span class="mo-sec-form">${escapeHtml(f.form)}</span>
            <span class="mo-sec-date">${formatFilingDate(f.filedDate)}</span>
          </a>`;
        }
        listHtml += `<a class="mo-sec-all" href="${buildEdgarBrowseUrl(v.cik)}" target="_blank" rel="noopener">View all on EDGAR →</a></div>`;
      }
      list.innerHTML = listHtml;
      card.appendChild(list);
    }).catch(e => console.warn('[sec] failed', e));
  }

  return card;
}

// =============================================================================
// CONVERSATION RENDER
// =============================================================================
function renderUserTurn(text) {
  const turn = $$('div', { class: 'mo-turn mo-turn-user' },
    $$('div', { class: 'mo-bubble', text }),
  );
  $conv.appendChild(turn);
  scrollBottom();
}

function renderMoTurn() {
  const proseEl = $$('div', { class: 'mo-prose' });
  const turn = $$('div', { class: 'mo-turn mo-turn-mo' }, proseEl);
  $conv.appendChild(turn);
  scrollBottom();
  return {
    appendText: (t) => { proseEl.append(document.createTextNode(t)); scrollBottom(); },
    insertEl: (el) => { turn.appendChild(el); scrollBottom(); },
    setError: (msg) => { turn.appendChild($$('div', { class: 'mo-err', text: msg })); },
    _shown: 0,
  };
}

function renderLoadingCard() {
  return $$('div', { class: 'mo-card mo-card-loading', text: 'Pulling from USASpending…' });
}

function scrollBottom() {
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

// =============================================================================
// CORE LOOP — askMo
// =============================================================================
//
// Streaming flow:
//   1. POST chat history to Lambda
//   2. As tokens stream, watch for the first valid <data .../>
//   3. When it appears: extract attrs, hide the tag from displayed prose,
//      render a loading card, fire pull() in background
//   4. When pull() resolves: replace loading card with real card
//   5. Continue streaming Mo's post-tag prose
//
// If Mo emits a broken tag (e.g. prose inside `until="..."` with no `/>`),
// the parser doesn't fire, but we still need to clean the displayed prose
// so the broken fragment doesn't render as visible garbage. We track whether
// Mo started a tag (`<data`) and suppress all subsequent text until either
// `/>` arrives or the stream ends.
async function askMo(question) {
  if (busy) return;
  busy = true;
  $send.disabled = true;

  renderUserTurn(question);
  history.push({ role: 'user', parts: [{ text: question }] });

  const moTurn = renderMoTurn();
  let fullText = '';
  let tagFired = false;
  let loadingEl = null;
  let suppressFrom = -1;  // index in fullText to start hiding from (broken tag opener)

  try {
    const res = await fetch(LAMBDA_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ history }),
    });
    if (!res.ok || !res.body) throw new Error(`Lambda ${res.status}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      fullText += decoder.decode(value, { stream: true });

      // Check for a valid self-closing tag first
      if (!tagFired) {
        const tag = findDataTag(fullText);
        if (tag) {
          tagFired = true;
          suppressFrom = -1;  // valid tag found, don't suppress
          // Show prose up to the tag start
          const upToTag = fullText.slice(0, tag.start);
          if (upToTag.length > moTurn._shown) {
            moTurn.appendText(upToTag.slice(moTurn._shown));
            moTurn._shown = upToTag.length;
          }
          // Collapse the tag out of fullText so post-tag prose continues seamlessly
          fullText = upToTag + fullText.slice(tag.end);

          loadingEl = renderLoadingCard();
          moTurn.insertEl(loadingEl);

          pull(tag.attrs)
            .then(({ rows, resolved, error }) => {
              const cardEl = renderCard(rows, tag.attrs, resolved);
              if (loadingEl && loadingEl.parentNode) {
                loadingEl.parentNode.replaceChild(cardEl, loadingEl);
              } else {
                moTurn.insertEl(cardEl);
              }
              if (error) moTurn.setError(error);
            })
            .catch(err => {
              if (loadingEl && loadingEl.parentNode) loadingEl.remove();
              moTurn.setError(`Couldn't pull data: ${err.message}`);
            });
        } else {
          // No valid tag yet — but did Mo start a broken tag we should hide?
          if (suppressFrom < 0) {
            const broken = findBrokenTagStart(fullText);
            if (broken >= 0) suppressFrom = broken;
          }
        }
      }

      // Stream prose tail, respecting suppression of broken-tag fragment
      const visibleEnd = suppressFrom >= 0 ? suppressFrom : fullText.length;
      if (visibleEnd > moTurn._shown) {
        moTurn.appendText(fullText.slice(moTurn._shown, visibleEnd));
        moTurn._shown = visibleEnd;
      }
    }

    // Stream done. If we suppressed prose because of a broken tag, leave it
    // suppressed — it's garbage.
    history.push({ role: 'model', parts: [{ text: fullText }] });
  } catch (err) {
    if (loadingEl && loadingEl.parentNode) loadingEl.remove();
    moTurn.setError(err.message);
  } finally {
    busy = false;
    $send.disabled = false;
    $input.focus();
  }
}

// =============================================================================
// COMPOSER
// =============================================================================
document.getElementById('composer').addEventListener('submit', (e) => {
  e.preventDefault();
  const q = $input.value.trim();
  if (!q || busy) return;
  $input.value = '';
  $input.style.height = 'auto';
  askMo(q);
});

$input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    document.getElementById('composer').requestSubmit();
  }
});

$input.addEventListener('input', () => {
  $input.style.height = 'auto';
  $input.style.height = Math.min(200, $input.scrollHeight) + 'px';
});
</script>
