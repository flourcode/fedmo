<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fedmo · Weekly Brief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ────────────────────────────────────────────────────────────
       Brief tool design tokens — copied from fedmo so the brief is
       self-contained (no dependency on the main app's stylesheet).
       Anyone can open brief.html directly and it renders correctly. */
    :root {
      --primary-100: #46446E;
      --primary-80:  #5E5B92;
      --primary-60:  #7572B7;
      --primary-40:  #ACAAD4;
      --primary-20:  #E3E3F1;

      --text-title: #2C2933;
      --text-body:  #2E2C35;
      --text-muted: #4A475A;
      --text-faint: #6C6880;

      --bg-screen: #FDFCFF;
      --bg-card:   #FFFFFF;
      --bg-tint:   #F6F5FB;

      --border:      #E3E3F1;
      --border-soft: #EFEEF7;

      --strong:  #16A34A;  /* green */
      --medium:  #CA8A04;  /* amber */
      --weak:    #6C6880;  /* faint gray */

      --radius:    16px;
      --radius-sm: 12px;
      --radius-pill: 999px;
      --shadow-lift: 0 4px 16px rgba(70,68,110,0.10);

      --font: 'Atkinson Hyperlegible Next', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      max-width: 920px;
      margin: 0 auto;
      padding: 32px 16px 80px;
      background: var(--bg-screen);
      color: var(--text-body);
      font-family: var(--font);
      line-height: 1.5;
    }

    /* ── Header ──────────────────────────────────────────────── */
    .brief-header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .brief-header h1 {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 4px;
      color: var(--text-title);
      letter-spacing: -0.02em;
    }
    .brief-header .subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* ── Stage 1: scan controls ──────────────────────────────── */
    .stage-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .stage-controls label {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stage-controls input[type="date"],
    .stage-controls input[type="number"] {
      padding: 8px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 13px;
      background: white;
      color: var(--text-title);
    }
    .stage-controls input[type="number"] { width: 70px; }

    .btn-primary {
      padding: 10px 20px;
      background: var(--primary-100);
      color: white;
      border: none;
      border-radius: var(--radius-pill);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary:hover { background: var(--primary-80); }
    .btn-primary:disabled {
      background: var(--primary-40);
      cursor: not-allowed;
    }
    .btn-secondary {
      padding: 8px 16px;
      background: white;
      color: var(--primary-100);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-secondary:hover { background: var(--bg-tint); }

    .stage-status {
      font-size: 13px;
      color: var(--text-muted);
      min-height: 20px;
      margin-bottom: 8px;
    }

    /* ── Stage divider ───────────────────────────────────────── */
    .stage-divider {
      margin: 32px 0 12px;
      padding-top: 24px;
      border-top: 1px solid var(--border-soft);
    }
    .stage-divider h2 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 4px;
      color: var(--text-title);
    }
    .stage-divider p {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
    }

    /* ── Bucket sections ────────────────────────────────────── */
    .bucket-section {
      margin-top: 20px;
    }
    .bucket-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .bucket-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-title);
    }
    .bucket-count {
      font-size: 12px;
      color: var(--text-faint);
    }

    /* ── Candidate card ─────────────────────────────────────── */
    .candidate {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.12s ease;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .candidate:hover {
      border-color: var(--primary-40);
    }
    .candidate.picked {
      border-color: var(--primary-100);
      background: var(--bg-tint);
      box-shadow: var(--shadow-lift);
    }
    .candidate-picknum {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--primary-100);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      visibility: hidden;
    }
    .candidate.picked .candidate-picknum { visibility: visible; }

    .candidate-body {
      flex: 1;
      min-width: 0;
    }
    .candidate-headline {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-title);
      margin-bottom: 2px;
      line-height: 1.4;
    }
    .candidate-meta {
      font-size: 12px;
      color: var(--text-faint);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .candidate-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      font-style: italic;
      opacity: 0.85;
      line-height: 1.4;
    }
    .strength {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .strength-strong { background: #DCFCE7; color: var(--strong); }
    .strength-medium { background: #FEF3C7; color: var(--medium); }
    .strength-weak   { background: var(--bg-tint); color: var(--weak); }
    .candidate-link {
      font-size: 11px;
      color: var(--primary-100);
      text-decoration: none;
    }
    .candidate-link:hover { text-decoration: underline; }

    /* ── Pick controls ──────────────────────────────────────── */
    .pick-bar {
      position: sticky;
      bottom: 16px;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-lift);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: space-between;
      margin-top: 24px;
      z-index: 10;
    }
    .pick-count-text {
      font-size: 13px;
      color: var(--text-title);
      font-weight: 500;
    }

    /* ── Output area ────────────────────────────────────────── */
    .output-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .output-pre {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      font-family: 'SF Mono', Menlo, Consolas, ui-monospace, monospace;
      font-size: 12px;
      color: var(--text-body);
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.5;
      max-height: 70vh;
      overflow-y: auto;
      outline: none;
    }
    .output-pre:focus { border-color: var(--primary-100); }

    .empty-state {
      padding: 24px;
      text-align: center;
      color: var(--text-faint);
      font-size: 13px;
      font-style: italic;
      background: var(--bg-tint);
      border-radius: var(--radius-sm);
    }

    .total-pill {
      display: inline-block;
      padding: 4px 12px;
      background: var(--primary-20);
      color: var(--primary-100);
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="brief-header">
  <h1>Fedmo · Weekly Brief</h1>
  <div class="subtitle">Find candidate signals from this week's federal contracting + SEC paper trail. Pick 2-6. Get a draft for LinkedIn or Substack.</div>
</div>

<!-- ── Stage 1: scan ─────────────────────────────────────────── -->
<div class="stage-controls">
  <label>Issue #
    <input type="number" id="issue-num" value="1" min="1" max="999">
  </label>
  <label>Since
    <input type="date" id="since-date">
  </label>
  <button class="btn-primary" id="find-candidates">Find this week's signals</button>
</div>
<div class="stage-status" id="stage-1-status"></div>

<!-- ── Stage 2: candidate buckets ────────────────────────────── -->
<div id="candidates-area"></div>

<!-- ── Stage 3: pick bar ─────────────────────────────────────── -->
<div class="pick-bar" id="pick-bar" hidden>
  <div class="pick-count-text" id="pick-count">Pick 2-6 signals to draft</div>
  <button class="btn-primary" id="generate-draft" disabled>Draft these signals</button>
</div>

<!-- ── Stage 4: draft output ─────────────────────────────────── -->
<div class="stage-divider" id="output-divider" hidden>
  <h2>Draft</h2>
  <p>Edit in place, then copy to LinkedIn or Substack.</p>
</div>
<div id="output-area" hidden>
  <div class="output-toolbar">
    <button class="btn-secondary" id="copy-md">Copy markdown</button>
    <button class="btn-secondary" id="copy-li">Copy for LinkedIn</button>
    <button class="btn-secondary" id="reroll">Reset picks</button>
  </div>
  <pre class="output-pre" id="output-pre" contenteditable="true"></pre>
</div>

<script>
'use strict';

// ─────────────────────────────────────────────────────────────────────
// Config: same Lambda URL the main fedmo app uses. The brief tool just
// hits a different endpoint (brief_candidates).
// ─────────────────────────────────────────────────────────────────────
const FEDMO_LAMBDA_URL = 'https://llonymyskdiakyxhlxlex7ul640hbcke.lambda-url.us-east-1.on.aws/';

// Bucket display config: title + helper text
const BUCKET_CONFIG = {
  recompete_watchlist: {
    title: 'Recompete watchlist',
    blurb: 'Multi-year incumbent contracts expiring in 14-60 days',
  },
  big_awards: {
    title: 'Big new awards',
    blurb: '$50M+ contract awards in the past week',
  },
  sec_paper_trail: {
    title: 'SEC paper trail',
    blurb: 'Recent filings from public federal primes',
  },
  subaward_moves: {
    title: 'Channel partner moves',
    blurb: 'Carahsoft, Four Points, and other resellers picking up new prime relationships',
  },
};

// Bucket order in the UI
const BUCKET_ORDER = ['recompete_watchlist', 'big_awards', 'sec_paper_trail', 'subaward_moves'];

// State
let candidatesByBucket = {};   // bucket → array of candidates
let pickedKeys = [];           // ordered array of "bucket:idx" keys
let dateRange = null;

const MIN_PICKS = 2;
const MAX_PICKS = 6;

// ─────────────────────────────────────────────────────────────────────
// Default since date = last Sunday
// ─────────────────────────────────────────────────────────────────────
const today = new Date();
const dayOfWeek = today.getDay();
const lastSunday = new Date(today);
lastSunday.setDate(today.getDate() - (dayOfWeek === 0 ? 7 : dayOfWeek));
document.getElementById('since-date').value = lastSunday.toISOString().slice(0, 10);

// ─────────────────────────────────────────────────────────────────────
// Stage 1: scan for candidates
// ─────────────────────────────────────────────────────────────────────
document.getElementById('find-candidates').addEventListener('click', async () => {
  const btn = document.getElementById('find-candidates');
  const status = document.getElementById('stage-1-status');
  const sinceDate = document.getElementById('since-date').value;

  btn.disabled = true;
  status.textContent = 'Scanning USASpending + EDGAR (~10-20 seconds)...';

  // Reset
  document.getElementById('candidates-area').innerHTML = '';
  document.getElementById('pick-bar').hidden = true;
  document.getElementById('output-area').hidden = true;
  document.getElementById('output-divider').hidden = true;
  pickedKeys = [];

  try {
    const t0 = Date.now();
    const res = await fetch(FEDMO_LAMBDA_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ request_type: 'brief_candidates', since_date: sinceDate }),
    });
    if (!res.ok) throw new Error(`Lambda ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    candidatesByBucket = data.buckets || {};
    dateRange = { since: data.since_date, generatedAt: data.generated_at };
    const elapsed = ((Date.now() - t0) / 1000).toFixed(1);

    const totalCount = Object.values(candidatesByBucket).reduce((s, b) => s + b.length, 0);
    status.innerHTML = `<span class="total-pill">${totalCount} candidates</span> scanned in ${elapsed}s`;
    renderCandidates();
    document.getElementById('pick-bar').hidden = false;
    updatePickCount();
  } catch (err) {
    status.textContent = `Error: ${err.message}`;
  } finally {
    btn.disabled = false;
  }
});

// ─────────────────────────────────────────────────────────────────────
// Render candidates organized by bucket
// ─────────────────────────────────────────────────────────────────────
function renderCandidates() {
  const area = document.getElementById('candidates-area');
  area.innerHTML = '';

  for (const bucket of BUCKET_ORDER) {
    const config = BUCKET_CONFIG[bucket];
    const candidates = candidatesByBucket[bucket] || [];

    const section = document.createElement('div');
    section.className = 'bucket-section';
    section.innerHTML = `
      <div class="bucket-head">
        <div>
          <div class="bucket-title">${config.title}</div>
          <div class="candidate-meta" style="margin-top:2px;">${config.blurb}</div>
        </div>
        <div class="bucket-count">${candidates.length} candidate${candidates.length === 1 ? '' : 's'}</div>
      </div>
    `;

    if (candidates.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'Nothing in this bucket this week.';
      section.appendChild(empty);
    } else {
      candidates.forEach((c, idx) => {
        const card = renderCandidateCard(bucket, idx, c);
        section.appendChild(card);
      });
    }
    area.appendChild(section);
  }
}

// Build a single candidate card. Rendering shape varies by bucket because
// the data shape varies — recompete has vendor + days left, SEC has filing
// type + date, etc.
function renderCandidateCard(bucket, idx, c) {
  const card = document.createElement('div');
  card.className = 'candidate';
  card.dataset.key = `${bucket}:${idx}`;

  const fmtMoney = (amt) => {
    if (amt >= 1e9) return '$' + (amt / 1e9).toFixed(1) + 'B';
    if (amt >= 1e6) return '$' + (amt / 1e6).toFixed(1) + 'M';
    if (amt >= 1e3) return '$' + (amt / 1e3).toFixed(0) + 'K';
    return '$' + amt;
  };

  let headline = '';
  let meta = '';
  let desc = '';
  let link = '';

  if (bucket === 'recompete_watchlist') {
    headline = `${titleCase(c.vendor || '')}${c.amount ? ' · ' + fmtMoney(c.amount) : ''}`;
    meta = `${c.agency || ''} · ${c.daysLeft}d left · ${c.popYears}yr PoP`;
    desc = c.description ? trim(c.description, 160) : '';
    link = c.contractLink;
  } else if (bucket === 'big_awards') {
    headline = `${titleCase(c.vendor || '')} · ${fmtMoney(c.amount)}`;
    meta = c.agency || '';
    desc = c.description ? trim(c.description, 160) : '';
    link = c.contractLink;
  } else if (bucket === 'sec_paper_trail') {
    const itemsStr = c.items ? ` (Item ${c.items})` : '';
    headline = `${c.vendor} · ${c.form}${itemsStr}`;
    meta = `Filed ${c.filedDate} · ${c.ticker}`;
    link = c.url;
  } else if (bucket === 'subaward_moves') {
    headline = `${titleCase(c.prime || '')} → ${titleCase(c.sub || '')} · ${fmtMoney(c.amount)}`;
    meta = `${c.agency || ''} · ${c.date || ''}`;
    desc = c.description ? trim(c.description, 160) : '';
    link = c.contractLink;
  }

  card.innerHTML = `
    <div class="candidate-picknum"></div>
    <div class="candidate-body">
      <div class="candidate-headline">${escapeHtml(headline)}</div>
      <div class="candidate-meta">
        <span class="strength strength-${c.strength}">${c.strength}</span>
        <span>${escapeHtml(meta)}</span>
        ${link ? `<a class="candidate-link" href="${link}" target="_blank" rel="noopener" onclick="event.stopPropagation()">view source →</a>` : ''}
      </div>
      ${desc ? `<div class="candidate-desc">${escapeHtml(desc)}</div>` : ''}
    </div>
  `;

  card.addEventListener('click', () => togglePick(`${bucket}:${idx}`));
  return card;
}

// ─────────────────────────────────────────────────────────────────────
// Pick logic
// ─────────────────────────────────────────────────────────────────────
function togglePick(key) {
  const idxInPicks = pickedKeys.indexOf(key);
  if (idxInPicks >= 0) {
    pickedKeys.splice(idxInPicks, 1);
  } else {
    if (pickedKeys.length >= MAX_PICKS) return;  // Cap
    pickedKeys.push(key);
  }
  // Update UI for this card and the pick bar
  document.querySelectorAll('.candidate').forEach(card => {
    const cardKey = card.dataset.key;
    const pos = pickedKeys.indexOf(cardKey);
    if (pos >= 0) {
      card.classList.add('picked');
      card.querySelector('.candidate-picknum').textContent = String(pos + 1);
    } else {
      card.classList.remove('picked');
      card.querySelector('.candidate-picknum').textContent = '';
    }
  });
  updatePickCount();
}

function updatePickCount() {
  const text = document.getElementById('pick-count');
  const btn = document.getElementById('generate-draft');
  const n = pickedKeys.length;
  if (n === 0) {
    text.textContent = 'Pick 2-6 signals to draft';
    btn.disabled = true;
  } else if (n < MIN_PICKS) {
    text.textContent = `${n} picked (need at least ${MIN_PICKS})`;
    btn.disabled = true;
  } else {
    text.textContent = `${n} picked`;
    btn.disabled = false;
  }
}

// ─────────────────────────────────────────────────────────────────────
// Stage 4: assemble draft from picks. Pure client-side — no LLM call.
// We're not asking Mo to write copy here; we're giving Mark a structured
// scaffold he can edit. The brief tool's job is curation, not generation.
// ─────────────────────────────────────────────────────────────────────
document.getElementById('generate-draft').addEventListener('click', () => {
  if (pickedKeys.length < MIN_PICKS) return;

  const issueNum = document.getElementById('issue-num').value || '?';
  const lines = [];
  lines.push(`# This Week in Fed IT — Issue ${issueNum}`);
  lines.push('');
  lines.push('*Federal contracting + SEC paper trail signals from the past week.*');
  lines.push('');
  lines.push(`*Generated with [fedmo.com](https://fedmo.com).*`);
  lines.push('');
  lines.push('---');
  lines.push('');

  pickedKeys.forEach((key, i) => {
    const [bucket, idxStr] = key.split(':');
    const idx = parseInt(idxStr, 10);
    const c = (candidatesByBucket[bucket] || [])[idx];
    if (!c) return;

    const heading = signalHeading(bucket, c);
    lines.push(`## ${i + 1}. ${heading}`);
    lines.push('');
    lines.push(signalSummary(bucket, c));
    lines.push('');
    const sourceLink = bucketSourceLink(bucket, c);
    if (sourceLink) {
      lines.push(`[View source →](${sourceLink})`);
      lines.push('');
    }
    lines.push('**Why it matters:** [your take here]');
    lines.push('');
    lines.push('---');
    lines.push('');
  });

  lines.push('*Want signals like this in your inbox? Reply to this post.*');
  lines.push('');
  lines.push('*Built with [fedmo.com](https://fedmo.com).*');

  const md = lines.join('\n');
  document.getElementById('output-pre').textContent = md;
  document.getElementById('output-area').hidden = false;
  document.getElementById('output-divider').hidden = false;

  // Scroll to draft
  setTimeout(() => {
    document.getElementById('output-divider').scrollIntoView({ behavior: 'smooth' });
  }, 100);
});

// Build a one-line headline for a signal in the draft
function signalHeading(bucket, c) {
  const fmtMoney = (amt) => {
    if (amt >= 1e9) return '$' + (amt / 1e9).toFixed(1) + 'B';
    if (amt >= 1e6) return '$' + (amt / 1e6).toFixed(1) + 'M';
    return '$' + (amt / 1e3).toFixed(0) + 'K';
  };
  if (bucket === 'recompete_watchlist') {
    return `${titleCase(c.vendor || '')} · recompete in ${c.daysLeft} days`;
  }
  if (bucket === 'big_awards') {
    return `${titleCase(c.vendor || '')} wins ${fmtMoney(c.amount)} from ${c.agency || ''}`;
  }
  if (bucket === 'sec_paper_trail') {
    const itemsStr = c.items ? ` Item ${c.items}` : '';
    return `${c.vendor} files ${c.form}${itemsStr}`;
  }
  if (bucket === 'subaward_moves') {
    return `${titleCase(c.prime || '')} subawards ${fmtMoney(c.amount)} to ${titleCase(c.sub || '')}`;
  }
  return 'Signal';
}

// Build a 2-3 sentence factual summary the user can edit.
function signalSummary(bucket, c) {
  const fmtMoney = (amt) => {
    if (amt >= 1e9) return '$' + (amt / 1e9).toFixed(1) + 'B';
    if (amt >= 1e6) return '$' + (amt / 1e6).toFixed(1) + 'M';
    return '$' + (amt / 1e3).toFixed(0) + 'K';
  };
  if (bucket === 'recompete_watchlist') {
    return `${titleCase(c.vendor || '')} holds a ${c.popYears}-year, ${fmtMoney(c.amount)} contract with ${c.agency || ''} that expires in ${c.daysLeft} days. ${c.description ? '*Scope:* ' + trim(c.description, 200) : ''}`;
  }
  if (bucket === 'big_awards') {
    return `${titleCase(c.vendor || '')} just received a ${fmtMoney(c.amount)} award from ${c.agency || ''}. ${c.description ? '*Scope:* ' + trim(c.description, 200) : ''}`;
  }
  if (bucket === 'sec_paper_trail') {
    const itemsStr = c.items ? ` (Item ${c.items})` : '';
    return `${c.vendor} (${c.ticker}) filed a ${c.form}${itemsStr} on ${c.filedDate}.`;
  }
  if (bucket === 'subaward_moves') {
    return `${titleCase(c.prime || '')} hired ${titleCase(c.sub || '')} as a sub on a ${fmtMoney(c.amount)} contract with ${c.agency || ''}. ${c.description ? '*Scope:* ' + trim(c.description, 200) : ''}`;
  }
  return '';
}

function bucketSourceLink(bucket, c) {
  if (bucket === 'sec_paper_trail') return c.url;
  return c.contractLink;
}

// ─────────────────────────────────────────────────────────────────────
// Output toolbar: copy and reset
// ─────────────────────────────────────────────────────────────────────
document.getElementById('copy-md').addEventListener('click', () => {
  const text = document.getElementById('output-pre').textContent;
  navigator.clipboard.writeText(text);
  flashButton('copy-md', 'Copied');
});

// LinkedIn doesn't render markdown — this strips formatting and reflows
// for native LinkedIn paste.
document.getElementById('copy-li').addEventListener('click', () => {
  let text = document.getElementById('output-pre').textContent;
  // Strip markdown headings, bold, italic, links
  text = text
    .replace(/^#+\s+/gm, '')               // headings
    .replace(/\*\*(.+?)\*\*/g, '$1')       // bold
    .replace(/\*(.+?)\*/g, '$1')           // italic
    .replace(/\[(.+?)\]\((.+?)\)/g, '$1')  // [text](url) → text
    .replace(/^---$/gm, '')                // horizontal rules
    .replace(/\n{3,}/g, '\n\n');           // collapse triple newlines
  navigator.clipboard.writeText(text.trim());
  flashButton('copy-li', 'Copied');
});

document.getElementById('reroll').addEventListener('click', () => {
  pickedKeys = [];
  document.querySelectorAll('.candidate').forEach(card => {
    card.classList.remove('picked');
    card.querySelector('.candidate-picknum').textContent = '';
  });
  updatePickCount();
  document.getElementById('output-area').hidden = true;
  document.getElementById('output-divider').hidden = true;
});

function flashButton(id, msg) {
  const btn = document.getElementById(id);
  const original = btn.textContent;
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = original; }, 1200);
}

// ─────────────────────────────────────────────────────────────────────
// Utilities
// ─────────────────────────────────────────────────────────────────────
function titleCase(s) {
  if (!s) return '';
  return String(s).toLowerCase().replace(/\b\w+/g, w => w.charAt(0).toUpperCase() + w.slice(1));
}
function trim(s, n) {
  if (!s) return '';
  return s.length > n ? s.slice(0, n) + '…' : s;
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
