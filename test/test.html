<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mo Test Harness — fedmo.com</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --primary-100: #46446E;
    --primary-80:  #6A6890;
    --primary-60:  #8E8DB1;
    --primary-40:  #B7B6CE;
    --primary-20:  #E3E3F1;
    --primary-10:  #F4F4FA;
    --bg:          #FAFAFD;
    --fg:          #1A1A2E;
    --fg-muted:    #5C5C7A;
    --border:      #E8E8F2;
    --pass:        #047857;
    --pass-bg:     #D1FAE5;
    --warn:        #92400E;
    --warn-bg:     #FEF3C7;
    --fail:        #991B1B;
    --fail-bg:     #FEE2E2;
    --code-bg:     #F4F4FA;
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px;
    --r-1: 4px; --r-2: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14141F; --fg: #E8E8F2; --fg-muted: #9999B5;
      --border: #2A2A3F; --code-bg: #1F1F2E; --primary-10: #1F1F2E; --primary-20: #2A2A44;
      --pass-bg: #064E3B; --warn-bg: #451A03; --fail-bg: #450A0A;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; padding: var(--s-5); max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 var(--s-1); color: var(--primary-100); }
  .subtitle { color: var(--fg-muted); margin-bottom: var(--s-4); font-size: 13px; }

  .seller-tabs { display: flex; gap: var(--s-1); flex-wrap: wrap; margin-bottom: var(--s-3); border-bottom: 1px solid var(--border); padding-bottom: var(--s-2); }
  .seller-tab { padding: var(--s-1) var(--s-3); border-radius: var(--r-1); font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid transparent; background: transparent; color: var(--fg-muted); }
  .seller-tab:hover { background: var(--primary-20); color: var(--primary-100); }
  .seller-tab.active { background: var(--primary-100); color: white; }
  .seller-tab[data-seller="aws"].active       { background: #F90; color: #000; }
  .seller-tab[data-seller="microsoft"].active  { background: #00A4EF; color: white; }
  .seller-tab[data-seller="atlassian"].active  { background: #0052CC; color: white; }
  .seller-tab[data-seller="datadog"].active    { background: #632CA6; color: white; }
  .seller-tab[data-seller="sonatype"].active   { background: #1B4D89; color: white; }
  .seller-tab[data-seller="akamai"].active     { background: #009BDE; color: white; }
  .seller-tab[data-seller="sentinelone"].active{ background: #7A00F5; color: white; }

  .controls { display: flex; gap: var(--s-3); align-items: center; margin-bottom: var(--s-4); flex-wrap: wrap; padding: var(--s-3); background: var(--primary-10); border-radius: var(--r-2); }
  button { background: var(--primary-100); color: white; border: none; padding: var(--s-2) var(--s-4); border-radius: var(--r-1); font: inherit; cursor: pointer; }
  button:hover { background: var(--primary-80); }
  button:disabled { opacity: 0.5; cursor: wait; }
  button.secondary { background: transparent; color: var(--primary-100); border: 1px solid var(--primary-40); }
  button.secondary:hover { background: var(--primary-20); }
  select { padding: var(--s-2) var(--s-3); border: 1px solid var(--border); border-radius: var(--r-1); font: inherit; background: var(--bg); color: var(--fg); }
  label { color: var(--fg-muted); font-size: 13px; }

  .summary { display: flex; gap: var(--s-3); margin-bottom: var(--s-4); font-size: 13px; flex-wrap: wrap; align-items: center; }
  .summary > div { padding: var(--s-2) var(--s-3); border-radius: var(--r-1); background: var(--primary-10); }
  .count { font-weight: 600; }
  .pass-count { color: var(--pass); } .warn-count { color: var(--warn); } .fail-count { color: var(--fail); } .pending-count { color: var(--fg-muted); }
  #progress-bar-wrap { flex: 1; min-width: 120px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  #progress-bar { height: 100%; width: 0%; background: var(--primary-100); transition: width 0.3s; border-radius: 3px; }

  .group-header { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-muted); margin: var(--s-4) 0 var(--s-2); padding-bottom: var(--s-1); border-bottom: 1px solid var(--border); }

  .scenario { border: 1px solid var(--border); border-radius: var(--r-2); margin-bottom: var(--s-2); overflow: hidden; background: var(--primary-10); }
  .scenario.status-fail { border-color: #fca5a5; }
  .scenario.status-warn { border-color: #fcd34d; }
  .scenario-head { padding: var(--s-2) var(--s-3); display: flex; align-items: center; gap: var(--s-3); cursor: pointer; user-select: none; }
  .scenario-head:hover { background: var(--primary-20); }

  .status-pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; min-width: 54px; text-align: center; }
  .status-pill.pass { background: var(--pass-bg); color: var(--pass); }
  .status-pill.warn { background: var(--warn-bg); color: var(--warn); }
  .status-pill.fail { background: var(--fail-bg); color: var(--fail); }
  .status-pill.pending { background: var(--border); color: var(--fg-muted); }
  .status-pill.running { background: var(--primary-20); color: var(--primary-100); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.5} }

  .scenario-name { flex: 1; font-weight: 500; font-size: 13px; }
  .seller-badge { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.3px; flex-shrink: 0; background: var(--primary-20); color: var(--primary-100); }
  .seller-badge[data-s="aws"]         { background: #FFF3CD; color: #7A5200; }
  .seller-badge[data-s="microsoft"]   { background: #E0F3FF; color: #00539B; }
  .seller-badge[data-s="atlassian"]   { background: #E0EDFF; color: #002F8F; }
  .seller-badge[data-s="datadog"]     { background: #F0E6FF; color: #4B0082; }
  .seller-badge[data-s="sonatype"]    { background: #E0EBF8; color: #102D5B; }
  .seller-badge[data-s="akamai"]      { background: #E0F4FF; color: #005F8A; }
  .seller-badge[data-s="sentinelone"] { background: #F3E0FF; color: #4A0090; }

  .scenario-tags { display: flex; gap: var(--s-1); flex-wrap: wrap; }
  .scenario-tag { font-size: 10px; padding: 1px 5px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-1); color: var(--fg-muted); }
  .scenario-timing { font-size: 11px; color: var(--fg-muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }

  .scenario-body { border-top: 1px solid var(--border); padding: var(--s-4); background: var(--bg); display: none; }
  .scenario-body.open { display: block; }
  .field { display: flex; gap: var(--s-3); margin-bottom: var(--s-2); font-size: 13px; }
  .field-label { color: var(--fg-muted); min-width: 90px; flex-shrink: 0; }
  .field-value { flex: 1; word-break: break-word; }
  pre, code { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code-bg); padding: var(--s-2) var(--s-3); border-radius: var(--r-1); overflow-x: auto; margin: 0; color: var(--fg); }
  .assertion-list { margin-top: var(--s-3); padding-top: var(--s-3); border-top: 1px dashed var(--border); }
  .assertion { display: flex; gap: var(--s-2); align-items: flex-start; padding: 3px 0; font-size: 13px; }
  .assertion-icon { flex-shrink: 0; width: 16px; text-align: center; font-weight: 700; }
  .assertion.pass .assertion-icon { color: var(--pass); }
  .assertion.fail .assertion-icon { color: var(--fail); }
  .assertion-msg { flex: 1; }
  .assertion-kind { font-size: 10px; text-transform: uppercase; color: var(--fg-muted); padding: 1px 5px; border-radius: var(--r-1); background: var(--primary-10); flex-shrink: 0; }
  details > summary { cursor: pointer; color: var(--primary-100); font-size: 12px; margin-top: var(--s-2); user-select: none; }
  details[open] > summary { margin-bottom: var(--s-2); }
</style>
</head>
<body>

<h1>Mo Test Harness</h1>
<p class="subtitle">Live tests against the production Lambda + USASpending. Filter by seller persona or tag. Failed tests auto-expand.</p>

<div class="seller-tabs" id="seller-tabs">
  <button class="seller-tab active" data-seller="">All</button>
  <button class="seller-tab" data-seller="aws">AWS</button>
  <button class="seller-tab" data-seller="microsoft">Microsoft</button>
  <button class="seller-tab" data-seller="atlassian">Atlassian</button>
  <button class="seller-tab" data-seller="datadog">Datadog</button>
  <button class="seller-tab" data-seller="sonatype">Sonatype</button>
  <button class="seller-tab" data-seller="akamai">Akamai</button>
  <button class="seller-tab" data-seller="sentinelone">SentinelOne</button>
</div>

<div class="controls">
  <button id="run">▶ Run</button>
  <label>Tag: <select id="tag-filter"><option value="">All</option></select></label>
  <button id="cancel" class="secondary" disabled>Cancel</button>
  <button id="export" class="secondary" disabled>Export JSON</button>
  <button id="copy"   class="secondary" disabled>Copy summary</button>
</div>

<div class="summary">
  <div><span class="count pass-count" id="pass-count">0</span> pass</div>
  <div><span class="count warn-count" id="warn-count">0</span> warn</div>
  <div><span class="count fail-count" id="fail-count">0</span> fail</div>
  <div><span class="count pending-count" id="pending-count">—</span> pending</div>
  <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  <div id="elapsed">—</div>
</div>

<div id="scenarios"></div>

<script type="module">
import { SCENARIOS } from './test-scenarios.js';
import { runAll }    from './test-runner.js';

const $scenarios    = document.getElementById('scenarios');
const $run          = document.getElementById('run');
const $cancel       = document.getElementById('cancel');
const $export       = document.getElementById('export');
const $copy         = document.getElementById('copy');
const $tagFilter    = document.getElementById('tag-filter');
const $passCount    = document.getElementById('pass-count');
const $warnCount    = document.getElementById('warn-count');
const $failCount    = document.getElementById('fail-count');
const $pendingCount = document.getElementById('pending-count');
const $elapsed      = document.getElementById('elapsed');
const $bar          = document.getElementById('progress-bar');
const $sellerTabs   = document.getElementById('seller-tabs');

const SELLER_TAGS = ['aws','microsoft','atlassian','datadog','sonatype','akamai','sentinelone'];
let activeSeller = '', activeTag = '', abortController = null, allResults = [];

// Populate tag filter
const allTags = new Set();
SCENARIOS.forEach(s => (s.tags||[]).forEach(t => allTags.add(t)));
[...allTags].sort().forEach(t => {
  const o = document.createElement('option'); o.value = t; o.textContent = t; $tagFilter.appendChild(o);
});

const filteredScenarios = () => SCENARIOS.filter(s => {
  const tags = s.tags || [];
  if (activeSeller && !tags.includes(activeSeller)) return false;
  if (activeTag    && !tags.includes(activeTag))    return false;
  return true;
});

$sellerTabs.addEventListener('click', e => {
  const tab = e.target.closest('.seller-tab'); if (!tab) return;
  activeSeller = tab.dataset.seller;
  $sellerTabs.querySelectorAll('.seller-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  $tagFilter.value = ''; activeTag = '';
  renderPlaceholders(filteredScenarios());
});
$tagFilter.addEventListener('change', () => {
  activeTag = $tagFilter.value; renderPlaceholders(filteredScenarios());
});

const fmtMoney = n => {
  if (!n) return '$0';
  if (n >= 1e9) return `$${(n/1e9).toFixed(2)}B`;
  if (n >= 1e6) return `$${(n/1e6).toFixed(1)}M`;
  if (n >= 1e3) return `$${(n/1e3).toFixed(0)}K`;
  return `$${n.toFixed(0)}`;
};
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const getSellerTag = s => (s.tags||[]).find(t => SELLER_TAGS.includes(t)) || '';

function renderPlaceholders(scenarios) {
  $scenarios.innerHTML = '';
  allResults = scenarios.map(() => ({ status: null, results: [] }));
  let lastGroup = null;
  scenarios.forEach((s, i) => {
    const seller = getSellerTag(s);
    if (!activeSeller && seller && seller !== lastGroup) {
      lastGroup = seller;
      const gh = document.createElement('div');
      gh.className = 'group-header';
      gh.textContent = seller.charAt(0).toUpperCase() + seller.slice(1) + ' scenarios';
      $scenarios.appendChild(gh);
    }
    $scenarios.appendChild(makeCard(s, i));
  });
}

function makeCard(scenario, idx) {
  const seller = getSellerTag(scenario);
  const badge = seller ? `<span class="seller-badge" data-s="${seller}">${seller}</span>` : '';
  const tags = (scenario.tags||[]).filter(t => !SELLER_TAGS.includes(t))
    .map(t => `<span class="scenario-tag">${esc(t)}</span>`).join('');
  const el = document.createElement('div');
  el.className = 'scenario'; el.dataset.idx = idx;
  el.innerHTML = `
    <div class="scenario-head">
      <span class="status-pill pending" data-role="status">pending</span>
      ${badge}
      <span class="scenario-name">${esc(scenario.name)}</span>
      <span class="scenario-tags">${tags}</span>
      <span class="scenario-timing" data-role="timing"></span>
    </div>
    <div class="scenario-body" data-role="body"></div>`;
  el.querySelector('.scenario-head').addEventListener('click', () =>
    el.querySelector('[data-role="body"]').classList.toggle('open'));
  return el;
}

function renderBody(result) {
  const s = result.snapshot;
  const tagJson = s.tagAttrs ? JSON.stringify(s.tagAttrs, null, 2) : '(no tag emitted)';
  const assertHtml = result.results.map(a => {
    const cls = a.passed ? 'pass' : 'fail';
    const errNote = a.err ? ` <span style="color:var(--fail)">[${esc(a.err)}]</span>` : '';
    return `<div class="assertion ${cls}">
      <span class="assertion-icon">${a.passed?'✓':'✗'}</span>
      <span class="assertion-msg">${esc(a.msg)}${errNote}</span>
      <span class="assertion-kind">${a.kind}</span>
    </div>`;
  }).join('');
  const sampleRows = (s.rows||[]).slice(0,3).map(r =>
    `${esc(r['Recipient Name']||'?')} — ${fmtMoney(Number(r['Award Amount']))} — ${esc(r['Award ID']||'')}`
  ).join('\n');
  const kwNote = s.keywordsDropped ? `<div class="field"><span class="field-label">Keywords</span><span class="field-value" style="color:var(--warn)">⚠ keyword-drop fallback fired</span></div>` : '';
  const repro = result.snapshot2 ? `<details><summary>Run 2 snapshot</summary><pre>${esc(JSON.stringify({tagAttrs:result.snapshot2.tagAttrs,rowCount:result.snapshot2.rowCount,total:result.snapshot2.total},null,2))}</pre></details>` : '';
  const prose = (s.proseBefore||'').slice(0,300);
  return `
    <div class="field"><span class="field-label">Question</span><span class="field-value"><code>${esc(s.question)}</code></span></div>
    <div class="field"><span class="field-label">Tag emitted</span><span class="field-value"><pre>${esc(tagJson)}</pre></span></div>
    <div class="field"><span class="field-label">Result</span><span class="field-value">${s.rowCount} rows · ${fmtMoney(s.total)} · ${s.timings.lambdaMs}ms Lambda · ${s.timings.usaspendingMs}ms API</span></div>
    ${kwNote}
    ${sampleRows ? `<div class="field"><span class="field-label">Top rows</span><span class="field-value"><pre>${esc(sampleRows)}</pre></span></div>` : ''}
    ${s.error ? `<div class="field"><span class="field-label">Error</span><span class="field-value" style="color:var(--fail)">${esc(s.error)}</span></div>` : ''}
    ${prose ? `<details><summary>Mo's prose (${(s.proseBefore||'').length} chars)</summary><pre>${esc(prose)}</pre></details>` : ''}
    ${repro}
    <div class="assertion-list">${assertHtml}</div>`;
}

function updateSummary(total) {
  const p = allResults.filter(r=>r.status==='pass').length;
  const w = allResults.filter(r=>r.status==='warn').length;
  const f = allResults.filter(r=>r.status==='fail').length;
  $passCount.textContent = p; $warnCount.textContent = w; $failCount.textContent = f;
  $pendingCount.textContent = (total-(p+w+f)) || '—';
  $bar.style.width = total ? `${((p+w+f)/total)*100}%` : '0%';
}

async function runTests() {
  const scenarios = filteredScenarios();
  if (!scenarios.length) return;
  renderPlaceholders(scenarios);
  $pendingCount.textContent = scenarios.length;
  $passCount.textContent = $warnCount.textContent = $failCount.textContent = '0';
  $bar.style.width = '0%'; $elapsed.textContent = '⏱ running…';
  $run.disabled = true; $cancel.disabled = false; $export.disabled = $copy.disabled = true;
  abortController = new AbortController();
  const t0 = performance.now();
  const firstCard = $scenarios.querySelector('.scenario');
  if (firstCard) { const p = firstCard.querySelector('[data-role="status"]'); p.className='status-pill running'; p.textContent='running'; }
  try {
    let idx = 0;
    for await (const result of runAll(scenarios, { abortSignal: abortController.signal })) {
      const cards = [...$scenarios.querySelectorAll('.scenario')];
      const card  = cards[idx]; if (!card) break;
      allResults[idx] = result;
      card.className = `scenario status-${result.status}`;
      const $s = card.querySelector('[data-role="status"]');
      const $t = card.querySelector('[data-role="timing"]');
      const $b = card.querySelector('[data-role="body"]');
      $s.className = `status-pill ${result.status}`; $s.textContent = result.status;
      $t.textContent = result.snapshot ? `${result.snapshot.timings.totalMs}ms` : '';
      $b.innerHTML = renderBody(result);
      if (result.status==='fail') $b.classList.add('open');
      updateSummary(scenarios.length);
      $elapsed.textContent = `⏱ ${((performance.now()-t0)/1000).toFixed(1)}s`;
      idx++;
      const nc = cards[idx];
      if (nc) { const np=nc.querySelector('[data-role="status"]'); np.className='status-pill running'; np.textContent='running'; }
    }
    $elapsed.textContent = `⏱ done in ${((performance.now()-t0)/1000).toFixed(1)}s`;
  } catch(e) {
    $elapsed.textContent = `⏱ aborted`; console.error(e);
  } finally {
    $run.disabled=false; $cancel.disabled=true; $export.disabled=$copy.disabled=false; abortController=null;
  }
}

$run.addEventListener('click', runTests);
$cancel.addEventListener('click', () => abortController?.abort());

$export.addEventListener('click', () => {
  const sc = filteredScenarios();
  const data = allResults.map((r,i) => ({
    name: r.name||sc[i]?.name, tags: r.tags||sc[i]?.tags||[], status: r.status,
    hardFails: r.hardFails??0, softFails: r.softFails??0,
    snapshot: r.snapshot ? { question:r.snapshot.question, tagAttrs:r.snapshot.tagAttrs,
      rowCount:r.snapshot.rowCount, total:r.snapshot.total,
      proseExcerpt:(r.snapshot.proseBefore||'').slice(0,500), timings:r.snapshot.timings,
      error:r.snapshot.error,
      sampleRows:(r.snapshot.rows||[]).slice(0,5).map(row=>({name:row['Recipient Name'],amount:row['Award Amount'],awardId:row['Award ID'],agency:row['Awarding Agency']}))
    } : null, assertions: r.results,
  }));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download = `mo-test-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;
  a.click();
});

$copy.addEventListener('click', () => {
  const sc = filteredScenarios();
  const p=allResults.filter(r=>r.status==='pass').length, w=allResults.filter(r=>r.status==='warn').length, f=allResults.filter(r=>r.status==='fail').length;
  const lines = [`Mo test results — ${new Date().toISOString()}`, `${p} pass · ${w} warn · ${f} fail`, ''];
  allResults.forEach((r,i) => {
    const name = r.name||sc[i]?.name||`scenario ${i}`;
    lines.push(`[${ (r.status||'?').toUpperCase().padEnd(5)}] ${name}`);
    if (r.results) r.results.filter(a=>!a.passed).forEach(a => lines.push(`       ✗ ${a.msg}`));
    if (r.snapshot?.tagAttrs) { lines.push(`       tag: ${JSON.stringify(r.snapshot.tagAttrs)}`); lines.push(`       result: ${r.snapshot.rowCount} rows, $${(r.snapshot.total/1e6).toFixed(2)}M`); }
    lines.push('');
  });
  navigator.clipboard.writeText(lines.join('\n')).then(() => {
    const orig=$copy.textContent; $copy.textContent='✓ Copied'; setTimeout(()=>{$copy.textContent=orig;},1500);
  });
});

renderPlaceholders(SCENARIOS);
window.testHarness = { SCENARIOS, allResults: () => allResults, filteredScenarios };
</script>
</body>
</html>
